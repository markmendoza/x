<!DOCTYPE html>
<html>
  <title>X is a Javascript template system for building JAM Stack applications.</title>
  <meta name="description" content="X javascript template system, JAM Stack">
  <head>
    <link rel="stylesheet" href="x.css"/>
    <script src="x.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  
  </head>
  <body>
    
    <script type="module">
      import {CodeJar} from "./codejar.min.js";
      window.CodeJar = CodeJar;
    </script>
    <template default>
      <main>
        class{
          construct(){
            this.cache = {};
            window.App = this;
            
            X.$.mediaQuery(0,1000,(isMobile)=>{
              this.isMobile = isMobile;
            });

          }

          message(){
            this.frame.contentWindow.postMessage({
              target : "preview",
              template : this.getValue()
            }, '*'); 
          }

          preview(){
            if(!this.frame){
              if(this.$.el.iframe)
                this.frame = this.$.el.iframe;
              var timer = setInterval(()=>{ 
                if(this.frame){
                  clearInterval(timer); 
                  this.message();
                }
              },250);
            }else{
              this.message();
            }
          }
          
          destruct(){
            
              var i = new installation().appendTo(this.$.prop.content);
              new util().appendTo(this.$.prop.content);

              new way1().appendTo(i.$.prop.way1);
              new way2().appendTo(i.$.prop.way2);
              new way3().appendTo(i.$.prop.way3);

              var examples = [
                {id:1,title:"Counter"},
                {id:2,title:"Observer"},
                {id:3,title:"Add class/hide/show elements"},
                {id:4,title:"Conditional statement/For loop"},
                {id:5,title:"Requiring js/css/template files"},
                {id:6,title:"Instantiating templates"},
                {id:7,title:"Await"},
                {id:8,title:"List"},
              ];
              for(var i in examples){
                new example(examples[i]).appendTo(this.$.prop.content);
              }
              
          }
        }
      </main>
    </template>
    <div class="x-grid" style="background:#efefef">
      <ul>
        <li data-if="!this.isMobile" style="width:25%"></li>
        <li style="padding:50px">
          <div style="background:#fff;padding:20px;border-radius:5px;border:1px solid #c0c0c0;">
            <img src="images/logo.png"/>
            <h2>X is a javascript template system for building JAM Stack applications.</h2>
            X is released under MIT License.
            <div data-prop="content"></div>
          </div>
        </li>
        <li data-if="!this.isMobile" style="width:25%"></li>
      </ul>
    </div>

    
      <template namespace="way1">
<pre>
  <code>
    &lt;html>
      &lt;body>
        &lt;template default>
          &lt;div>Hello world&lt;/div>
        &lt;/template>
      &lt;/body>
    &lt;/html>
  </code>
</pre>
      </template>
      <template namespace="way2">
<pre>
  <code>
    &lt;html>
      &lt;body>
        &lt;template default>
          &lt;require namespace="test">/path/to/template.tpl&lt;/require>
          &lt;main>
            class{
              construct(){
                this.ready(function(){
                  new test().appendTo(selector);
                });
              }
            }
          &lt;/main>
        &lt;/template>
      &lt;/body>
    &lt;/html>
  </code>
</pre>
      </template>
      <template namespace="way3">
        <pre>
          <code>
  X.template("path/to/template.tpl").ready(function(template){
    new template(options).appendTo(selector);
  });
          </code>
        </pre>
      </template>
      <template namespace="installation">
        <h5>Getting Started</h5>
        <div>Add the script inside the head or body tag. Thats it. No build tools or configurations required.</div>
        <pre>
          <code>
  <script src="https://markmendoza.github.io/x/x.js"></script>
          </code>
        </pre>
        <h5>Ways to use templates</h5>
        <div>1. as HTML template</div>
        <div data-prop="way1"></div>
        <div>2. Requiring the file</div>
        <div data-prop="way2"></div>
        <div>3. via function</div>
        <div data-prop="way3"></div>
      </template>

            

      <template namespace="util">
        <h5>Utilities</h5>
        <pre>
          <code>
  //https://raw.githubusercontent.com/blueimp/JavaScript-MD5/master/js/md5.min.js 
  md5(str);

  //https://cdnjs.com/libraries/Base64
  base64.encode(str);
  base64.decode(encodedStr);

  //Date Format 1.2.3
  //(c) 2007-2009 Steven Levithan | stevenlevithan.com
  new Date().format();

  X.$.mediaQuery(start,end, function(inRange){   });
  X.$.css(css,[start,end], namespace(optional));

  X.$.query(selector).each(function(o){});
  X.$.query.extend(name, function(){});

  X.$.passcrypt.encrypt(str);
  X.$.passcrypt.decrypt(encryptedString);
          </code>
        </pre>
      </template>

      <template namespace="example">
        <main>
          class{
            destruct(){
              fetch('templates/examples/'+this.$.options.id+'.txt')
                .then(function(r){ return r.text(); })
                .then((d)=>{
                    
                    this.code = CodeJar(this.$.el.source,function(){});
                    var timer;
                    this.code.onUpdate((code)=>{
                      clearTimeout(timer);
                      setTimeout(()=>{
                        this.preview();
                      },1000);
                    });
                    this.code.updateCode(d); 
                    hljs.highlightElement(this.$.el.source, {language:"html"});
                    
              });
            }

            preview(){
              var timer = setInterval(()=>{
                if(this.frame){
                  clearInterval(timer);
                  this.frame.contentWindow.postMessage({
                    target : "preview",
                    template : this.code.toString()
                  }, '*');
                } 
              },300);
            }
          }
        </main>
        <h2>{(this.$.options.title)}</h2>
        <div data-el="source" class="source"></div>
        <iframe src="preview.html" data-el="iframe" data-bind-load="function(o){ this.frame = o; }" style="border:1px solid #efefef;height:200px;width:100%;"></iframe>
      </template>
    
  </body>
</html>
